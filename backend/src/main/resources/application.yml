spring:
  application:
    name: paytrack-backend
  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB:paytrack}
    username: ${POSTGRES_USER:paytrack}
    password: ${POSTGRES_PASSWORD:paytrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

paytrack:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-make-it-long-enough}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  security:
    encryption-key: ${TOKEN_ENCRYPTION_KEY:dev-only-insecure-encryption-key-change-me}
  mail:
    from: ${MAIL_FROM:noreply@paytrack.local}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:4566}
    access-key: ${MINIO_ROOT_USER:paytrack}
    secret-key: ${MINIO_ROOT_PASSWORD:paytrack123}
    bucket: ${MINIO_BUCKET:paytrack-invoices}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
  reminders:
    offsets-days: 7,3,1
    cron: "0 0 8 * * *"

logging:
  level:
    com.paytrack: INFO
