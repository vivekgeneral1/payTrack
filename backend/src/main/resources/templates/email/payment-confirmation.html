<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1221; margin:0; padding:24px; color:#e2e4f0; }
        .card { max-width:480px; margin:0 auto; background:linear-gradient(145deg,#191d33,#13162a); border-radius:16px; padding:32px; border:1px solid #2a2f52; }
        .brand { font-weight:700; font-size:20px; background:linear-gradient(90deg,#10b981,#06b6d4); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:16px; }
        .amount { font-size:28px; font-weight:700; color:#10b981; }
        .muted { color:#9ca3af; font-size:13px; margin-top:24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">PayTrack</div>
    <h2>Payment received ✓</h2>
    <p th:text="'Your payment for ' + ${title} + ' was successful.'">Payment successful.</p>
    <div class="amount" th:text="${currency} + ' ' + ${amount}">INR 0.00</div>
    <p>Razorpay payment ID: <strong th:text="${razorpayPaymentId}">-</strong></p>
</div>
</body>
</html>
