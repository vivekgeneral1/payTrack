<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1221; margin:0; padding:24px; color:#e2e4f0; }
        .card { max-width:480px; margin:0 auto; background:linear-gradient(145deg,#191d33,#13162a); border-radius:16px; padding:32px; border:1px solid #2a2f52; }
        .brand { font-weight:700; font-size:20px; background:linear-gradient(90deg,#f59e0b,#ef4444); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:16px; }
        .muted { color:#9ca3af; font-size:13px; margin-top:24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">PayTrack</div>
    <h2 th:text="${providerName} + ' cancelled'">Subscription cancelled</h2>
    <p th:text="'Effective ' + ${effectiveDate} + '. You will no longer be charged.'">Cancelled.</p>
    <p th:if="${reason}" th:text="'Reason: ' + ${reason}">Reason</p>
</div>
</body>
</html>
